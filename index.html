<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#FFFCF6">
  <title>Painel Bôdhi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2323BB84'/%3E%3C/svg%3E">
  <script>try{var d=document.documentElement,L=localStorage,q=new URLSearchParams(location.search);["visual","modo","cor"].forEach(function(k){var v=q.get(k);if(v)L.setItem("bodhi."+k,v)});if(L.getItem("bodhi.visual")==="novo")d.setAttribute("data-visual","novo");if(L.getItem("bodhi.modo")==="noturno")d.setAttribute("data-modo","noturno");var c=L.getItem("bodhi.cor");if(c==="rosa"||c==="verde")d.setAttribute("data-cor",c)}catch(e){}</script>
  <link rel="stylesheet" href="css/app.css?v=105">
  <link rel="stylesheet" href="css/visual-novo.css?v=105">
</head>
<body>
  <div id="app"></div>
  <noscript>Este painel precisa de JavaScript para funcionar.</noscript>
  <script type="module" src="js/main.js?v=105"></script>
</body>
</html>
