<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0F2832">
  <title>Painel Bôdhi</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{display:flex;align-items:center;justify-content:center;padding:24px;background:#0F2832;color:#FFFCF6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
    main{max-width:340px}
    .ponto{width:56px;height:56px;margin:0 auto 22px;border-radius:50%;background:#23BB84;box-shadow:0 0 0 10px rgba(35,187,132,.18)}
    h1{margin:0 0 10px;font-size:22px;font-weight:700}
    p{margin:0 0 26px;font-size:15px;line-height:1.5;color:rgba(255,252,246,.78)}
    button{font:inherit;font-weight:600;padding:13px 26px;border:0;border-radius:999px;background:#23BB84;color:#0F2832;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="ponto" aria-hidden="true"></div>
    <h1>Sem internet por enquanto</h1>
    <p>O painel precisa de conexão para mostrar os dados de clientes e tarefas. Quando a internet voltar, é só tentar de novo.</p>
    <button type="button" onclick="location.href='/'">Tentar de novo</button>
  </main>
</body>
</html>
